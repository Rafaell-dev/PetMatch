name: CI - Push

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Compilar projeto TypeScript
        run: npm run build

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificação de Linter
        run: npm run lint

      - name: Executar testes de unidade e integração com cobertura
        run: npm run test:ci

      - name: Verificar cobertura de código
        run: |
          echo "📊 Relatório de cobertura gerado em coverage/"
          echo "O Jest já está configurado para exigir cobertura mínima de 90%"
          echo "Se a cobertura for menor que 90%, o job falhará automaticamente"
